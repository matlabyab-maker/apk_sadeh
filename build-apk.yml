name: Build Fast Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install official Gradle 8.7 Wrapper
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-wrapper.jar             -o gradle/wrapper/gradle-wrapper.jar
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-wrapper.jar.sha256             -o /tmp/gradle-wrapper.jar.sha256
          echo "$(cat /tmp/gradle-wrapper.jar.sha256)  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x ./gradlew

      - name: Verify Gradle Wrapper
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastRadio-Lite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
