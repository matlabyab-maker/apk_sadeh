name: Build APK - Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show project structure
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 5 -type f | sort
          echo "===== ROOT SETTINGS ====="
          cat settings.gradle
          echo "===== ROOT BUILD ====="
          cat build.gradle
          echo "===== APP BUILD ====="
          cat app/build.gradle

      - name: Check Android SDK
        run: |
          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed
          echo "===== JAVA ====="
          java -version
          echo "===== GRADLE ====="
          gradle --version

      - name: Build APK and show full error
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --info
          STATUS=$?
          echo "===== GRADLE EXIT CODE: $STATUS ====="
          exit $STATUS

      - name: List generated APKs
        if: always()
        run: |
          echo "===== APK FILES ====="
          find app/build -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FastRadio-Lite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
